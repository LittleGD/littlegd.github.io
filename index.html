<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JML.Studio</title>
<meta name="description" content="일상을 게임처럼 만드는 앱을 만드는 1인 개발 스튜디오, JML.Studio.">
<meta name="theme-color" content="#0a0a0a">

<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="JML.Studio">
<meta property="og:description" content="일상을 게임처럼 만드는 앱을 만드는 1인 개발 스튜디오.">
<meta property="og:image" content="https://littlegd.github.io/assets/upnext-icon-512.png">

<link rel="icon" type="image/png" href="assets/upnext-icon-512.png">
<link rel="apple-touch-icon" href="assets/upnext-icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <p class="logo">JML.Studio</p>
    <p class="tagline">
      일상을 게임처럼 만드는 앱을 만듭니다
      <span class="tagline-en">We build apps that turn everyday life into a game.</span>
    </p>
  </div>
</header>

<main>
  <section class="launches" aria-labelledby="launches-heading">
    <div class="wrap">
      <p class="eyebrow" id="launches-heading">출시작 <span class="eyebrow-en">Launches</span></p>

      <article class="app-card">
        <img
          class="app-icon"
          src="assets/upnext-icon-512.png"
          alt="UpNext 앱 아이콘"
          width="512"
          height="512"
          loading="lazy"
        >

        <div class="app-info">
          <h2 class="app-title">
            UpNext: 챌린지 카드 갓생
            <span class="app-title-en">UpNext: Challenge Card Habits</span>
          </h2>

          <p class="app-desc">매일 내 덱에서 챌린지 카드를 뽑아 수행하는 로그라이크 갓생 앱</p>

          <div class="app-links">
            <a class="app-link" href="https://apps.apple.com/app/id6762550135" target="_blank" rel="noopener">
              App Store <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>
            <a class="app-link" href="https://up-next-phi.vercel.app" target="_blank" rel="noopener">
              웹에서 사용 <span class="arrow" aria-hidden="true">&#8599;</span>
            </a>
            <span class="app-link app-link--soon" aria-disabled="true">
              Google Play <span class="badge">출시 준비 중</span>
            </span>
          </div>
        </div>
      </article>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="footer-name">Jongmin Lee</p>
    <nav class="footer-links" aria-label="Contact links">
      <a href="https://www.linkedin.com/in/jongmin-lee-design/" target="_blank" rel="noopener">LinkedIn</a>
      <span class="dot" aria-hidden="true">&middot;</span>
      <a href="https://www.jongmin.design" target="_blank" rel="noopener">Portfolio</a>
    </nav>
  </div>
</footer>

</body>
</html>
