          <filter id="ink-1" x="-10%" y="-20%" width="120%" height="140%">

          <filter id="ink-2" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11"/>

            <feGaussianBlur stdDeviation="0.55"/>
            <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.85 1"/></feComponentTransfer>
          </filter>
          <filter id="ink-3" x="-10%" y="-20%" width="120%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="27"/>
            <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
            <feGaussianBlur stdDeviation="0.55"/>
            <feComponentTransfer><feFuncA type="table" tableValues="0 0 0.85 1"/></feComponentTransfer>
